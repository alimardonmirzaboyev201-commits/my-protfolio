<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xadra Milliy Taomlar</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>

  <header>
    <div class="logo">Milliy</div>
    <nav>
      <a href="#">Menu</a>
      <a href="#">Biz haqimizda</a>
      <a href="#">Manzil</a>
      <a href="#">Yetkazib berish</a>
    </nav>
    <div class="cart-icon">🛒</div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Xadra Milliy taomlar</h1>
      <p>Mazali va sifatli milliy taomlar to'plami. Buyurtma bering va bahramand bo'ling!</p>
      <button class="order-btn">Buyurtma berish</button>
    </div>
    <div class="hero-image">
    </div>
  </section>

  <section class="menu-container">
    <h2>Siz uchun <span class="highlight">maxsus</span></h2>

    <div class="menu-grid">
      <div class="card">
        <img src="unsplash_SqYmTDQYMjo.svg" alt="Shorva">
        <div class="card-info">
          <h3>Shorva</h3>
          <span class="price">20.000</span>
        </div>
        <button class="add-to-cart">🛒</button>
      </div>

      <div class="card">
        <img src="unsplash_SqYmTDQYMjo (1).svg" alt="Manti">
        <div class="card-info">
          <h3>Manti</h3>
          <span class="price">20.000</span>
        </div>
        <button class="add-to-cart">🛒</button>
      </div>

      <div class="card">
        <img src="unsplash_QXzdFy92CGY (2).svg" alt="Tandir">
        <div class="card-info">
          <h3>Tandir</h3>
          <span class="price">50.000</span>
        </div>
        <button class="add-to-cart">🛒</button>
      </div>

      <div class="card">
        <img src="img_product.svg" alt="Somsa">
        <div class="card-info">
          <h3>Somsa</h3>
          <span class="price">6.000</span>
        </div>
        <button class="add-to-cart">🛒</button>
      </div>

    </div>
  </section>

</body>

</html>
