<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maʼlumotnoma</title>
    <link rel="stylesheet" type="text/css" href="Css2.css">
</head>
<body>
    <main class="container">
        <h1>Registration Form</h1>
        <form action="https://echo.htmlacademy.ru/courses" method="post" autocomplete="on">
            <label>
                Full name    
                <input type="text" name="lastname" required placeholder="to'lliq ismingizni kiriting">
            </label>
            <br>
          
            <label>
                E-mail 
                <input type="email" name="email" required placeholder="pochta manzilingizni kiriting">
            </label>
            <br>
            <label>
                Password
                <input type="password" name="password" required placeholder="yangi parol kiriting">
            </label>
            <br>
            <label>
                Mobile
                <input type="tel" name="mobile" placeholder="+998901234567" pattern="\+\d{9,15}">
            </label>
            <br>
             <label>
            <hr>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
